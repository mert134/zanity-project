<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Zanity Scripts</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; text-align: center; padding: 50px 20px; margin: 0; }
        h1 { color: #38bdf8; font-size: 2.5rem; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 1.1rem; }
        .card { background-color: #1e293b; border-radius: 12px; padding: 25px; margin: 20px auto; max-width: 500px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: left; }
        .card h3 { color: #f43f5e; margin-top: 0; }
        code { background-color: #020617; color: #22c55e; padding: 10px; display: block; border-radius: 6px; font-family: monospace; overflow-x: auto; font-size: 0.9rem; }
        .btn { background-color: #0284c7; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 15px; font-weight: bold; }
        .btn:hover { background-color: #0369a1; }
    </style>
</head>
<body>

    <h1>Official Zanity</h1>
    <p>deneme123 alo</p>

    <div class="card">
        <h3>Test site</h3>
    </div>

</body>
</html>
